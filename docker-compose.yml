# Déploiement Docker dans /opt/docker/budgetpbdbcompta (même modèle que anemo) :
#   cp .env.example .env   (renseigner BASIC_AUTH_USER / BASIC_AUTH_PASSWORD)
#   docker compose pull && docker compose up -d
# Nginx Proxy Manager : budgetpbdbcompta.aic-informatique.net → http://192.168.100.236:3000
services:
  budgetpbdbcompta:
    # Image construite par GitHub Actions à chaque changement de main
    # (.github/workflows/docker-image.yml) et mise à jour par Watchtower.
    # `docker compose up -d --build` reste possible pour construire sur place.
    image: ghcr.io/infoaicinformatique/budgetpbdbcompta:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: budgetpbdbcompta
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      # Identifiant / mot de passe d'accès : hors du dépôt, jamais dans l'image.
      - path: .env
        required: false
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - TZ=Europe/Paris
      # Derrière Nginx Proxy Manager : adresse du client lue dans X-Real-IP
      # (limitation des essais de mot de passe). Suppose que seul NPM joint
      # le port 3000 (voir README, ufw).
      - TRUST_PROXY=true
    volumes:
      # Droits d'accès de chacun (Paramètres › Droits d'accès) : volume nommé,
      # créé au premier lancement avec les bons droits d'écriture et conservé
      # quand le conteneur est recréé (Watchtower, docker compose up).
      # Lire ou sauvegarder : docker exec budgetpbdbcompta cat /data/droits.json
      - droits:/data
      # Autorité de certification de l'annuaire LDAP, si elle est interne :
      # déposer le fichier à côté de ce compose, décommenter, et renseigner
      # LDAP_CA_FILE=/certs/ldap-ca.pem dans .env.
      # - ./ldap-ca.pem:/certs/ldap-ca.pem:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      # La compression de budget-app.html au démarrage prend quelques secondes.
      start_period: 20s
    # L'application ne stocke rien côté serveur (les budgets vivent dans le
    # navigateur) : conteneur en lecture seule, sans privilèges.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    labels:
      # Seuls les conteneurs portant ce label sont mis à jour par Watchtower.
      - com.centurylinklabs.watchtower.enable=true
    networks:
      - budgetnet

networks:
  budgetnet:
    driver: bridge

volumes:
  droits:
