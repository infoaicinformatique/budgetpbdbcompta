# Apache en reverse proxy devant `npm start` (127.0.0.1:3000).
#   a2enmod proxy proxy_http headers ssl rewrite
#   cp deploy/apache.conf /etc/apache2/sites-available/budgetpbdbcompta.conf
#   a2ensite budgetpbdbcompta && apachectl configtest && systemctl reload apache2
#   certbot --apache -d budgetpbdbcompta.aic-informatique.net --redirect
# certbot crée ensuite budgetpbdbcompta-le-ssl.conf (port 443) à partir de ce bloc.
<VirtualHost *:80>
    ServerName budgetpbdbcompta.aic-informatique.net

    ProxyPreserveHost On
    ProxyRequests Off
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    RequestHeader set X-Forwarded-Proto expr=%{REQUEST_SCHEME}

    ErrorLog  ${APACHE_LOG_DIR}/budgetpbdbcompta-error.log
    CustomLog ${APACHE_LOG_DIR}/budgetpbdbcompta-access.log combined
</VirtualHost>
