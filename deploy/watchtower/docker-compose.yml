# Watchtower : met à jour automatiquement les conteneurs dont l'image a changé
# sur son registre. À copier dans /opt/docker/watchtower/docker-compose.yml :
#   docker compose up -d
#
# Seuls les conteneurs portant le label com.centurylinklabs.watchtower.enable=true
# sont concernés (budgetpbdbcompta) : NPM, anemo, etc. ne sont pas touchés tant
# qu'on ne leur ajoute pas ce label.
#
# Image : nickfedor/watchtower, suite maintenue de containrrr/watchtower
# (l'original n'est plus maintenu et refuse de parler aux Docker Engine récents).
services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Identifiants de registre (docker login ghcr.io) : nécessaires seulement
      # si le paquet ghcr.io/infoaicinformatique/budgetpbdbcompta est privé.
      - /root/.docker/config.json:/config.json:ro
    environment:
      - TZ=Europe/Paris
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_POLL_INTERVAL=300
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
