# Alternative à Caddy : nginx + certbot.
#   cp deploy/nginx.conf /etc/nginx/sites-available/budgetpbdbcompta
#   ln -s /etc/nginx/sites-available/budgetpbdbcompta /etc/nginx/sites-enabled/
#   certbot --nginx -d budgetpbdbcompta.aic-informatique.net
#   systemctl reload nginx
server {
    listen 80;
    listen [::]:80;
    server_name budgetpbdbcompta.aic-informatique.net;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
